<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết tin tức - ROG TechStore</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .news-detail-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
        .news-detail-content { line-height: 1.8; font-size: 1.1rem; color: #333; }
        .news-header { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    </style>
</head>
<body>
    <main class="container" style="margin-top: 40px; max-width: 800px;">
        <div id="news-detail-render">
            </div>
        <div style="margin-top: 50px;">
            <a href="news.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Quay lại tin tức</a>
        </div>
    </main>

    <script src="js/utils.js"></script>
    
    <script src="js/news-data.js"></script> 
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            
            // SỬA DÒNG NÀY: Dùng hàm getAllNews() thay vì gọi thẳng localStorage
            const posts = typeof getAllNews === 'function' ? getAllNews() : [];
            const post = posts.find(p => String(p.id) === String(postId));

            const renderArea = document.getElementById('news-detail-render');
            if (post) {
                renderArea.innerHTML = `
                    <div class="news-header">
                        <span style="color: #e02424; font-weight: bold;">TIN TỨC ROG</span>
                        <h1 style="font-size: 2.5rem; margin: 10px 0;">${post.title}</h1>
                        <p style="color: #666;">Ngày đăng: ${new Date(post.createdAt).toLocaleDateString('vi-VN')}</p>
                    </div>
                    <div class="news-detail-content">
                        ${post.content} 
                    </div>
                `;
                document.title = post.title + " - ROG TechStore";
            } else {
                renderArea.innerHTML = "<h2>Không tìm thấy bài viết.</h2>";
            }
        });
    </script>
</body>
</html>
